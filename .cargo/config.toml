[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = [
  # On Windows MSVC, statically link the C runtime so that the resulting EXE
  # does not depend on the vcruntime DLL.
  #
  # See: https://github.com/BurntSushi/ripgrep/pull/1613
  "-C", "target-feature=+crt-static",
  # On Windows MSVC, delay-load userenv.dll so that it, and the rpcrt4.dll and
  # ucrtbase.dll it pulls in, aren't loaded at startup. std only calls into it
  # from `std::env::home_dir` when USERPROFILE isn't set.
  "-C", "link-arg=/DELAYLOAD:userenv.dll",
  "-C", "link-arg=delayimp.lib",
]

# Do the same static linking for MUSL targets. At the time of writing
# (2023-10-23), this is the default. But the plan is for the default to change
# to dynamic linking. The whole point of MUSL with respect to ripgrep is to
# create a fully statically linked executable.
#
# See: https://github.com/rust-lang/compiler-team/issues/422
# See: https://github.com/rust-lang/compiler-team/issues/422#issuecomment-812135847
[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
]
